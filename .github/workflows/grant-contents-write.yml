name: Grant contents write for runtime

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/grant-contents-write.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify write permission (dry-run)
        run: |
          echo "GITHUB_TOKEN has contents: write"
          # To actually test writing (optional), uncomment and run this curl command.
          # It will create a file named test-permissions.txt in the repo root.
          # curl -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
          #   https://api.github.com/repos/ozzyag9-cloud/ai-song-studio/contents/test-permissions.txt \
          #   -d '{"message":"test write","content":"dGVzdCBmaWxlCg=="}'
